<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-label="FreeDroidWarn">
  <!-- A text badge composed for the Krinik showcase: the FreeDroidWarn project (github.com/woheller69/FreeDroidWarn,
       Apache-2.0) has no logo or badge of its own. Drawn after what the library shows: an Android alert dialog. -->
  <rect x="2" y="2" width="416" height="296" rx="28" fill="#2B2930" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  <g transform="translate(210 82)">
    <path d="M0 -44 L50 40 L-50 40 Z" fill="#FFB020" stroke="#FFB020" stroke-width="14" stroke-linejoin="round"/>
    <rect x="-5.5" y="-18" width="11" height="34" rx="5.5" fill="#2B2930"/>
    <circle cx="0" cy="29" r="6.5" fill="#2B2930"/>
  </g>
  <text x="210" y="186" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">FreeDroidWarn</text>
  <text x="210" y="226" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#E6E0E9" fill-opacity="0.85">Warns users about Google's</text>
  <text x="210" y="252" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#E6E0E9" fill-opacity="0.85">developer verification</text>
</svg>
