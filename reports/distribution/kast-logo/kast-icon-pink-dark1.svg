<?xml version="1.0" encoding="UTF-8"?>
<!--
  KAST app icon, acid-pink recolour of assets/logo/kast-icon.svg (owner 2026-11-07: «его просто в розовые тона перевести»); geometry untouched. Original note: The owner's choice: logo sheet KAST_LOGO_raw.png, top row,
  second from the left. Traced over the owner's 4x upscale (KAST_LOGO_raw_upscayl_4x_ultramix-balanced-4x.png):
  every coordinate below is a pixel of the 960x960 crop +1160+250 of that upscale, and the viewBox is the plate.
  Groups: #plate (the dark rounded square) and #glyph (the screen, its frame and the pixel squares).
  Android layers are generated from this file by tools/make-launcher-icon.mjs — edit HERE, then rerun the script.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 56 840 840" width="1024" height="1024">
  <defs>
    <linearGradient id="screenFill" gradientUnits="userSpaceOnUse" x1="434" y1="660" x2="717" y2="330">
      <stop offset="0" stop-color="#CC0070"/>
      <stop offset="0.5" stop-color="#FF1A8C"/>
      <stop offset="1" stop-color="#FFA3D1"/>
    </linearGradient>
  </defs>
  <rect id="plate" x="52" y="56" width="840" height="840" rx="170" ry="170" fill="#4E1236"/>
  <g id="glyph">
    <!-- the frame: an open bracket in perspective; the top bar ends in a short hook on the left -->
    <path id="frame" fill="#FF3D9E" d="M 338 343 C 338 314 352 304 390 299.4 L 720 244.6 C 790 233 804 262 804 330 L 804 690
      C 804 760 780 776 720 770.7 L 430 716.8 Q 417 714 417 702 L 417 697 Q 417 684 430 685.3 L 721 723.8
      C 745 727 756 720 756 700 L 756 310 C 756 290 748 283 725 287.8 L 398 342.7 L 398 352 C 398 366 386 372 368 372 C 350 372 338 366 338 352 Z"/>
    <!-- the screen panel with the notch on its left side -->
    <path id="screen" fill="url(#screenFill)" d="M 434 392 Q 434 376 450 372 L 697 331.2 Q 717 328 717 348 L 717 665
      Q 717 686 697 681 L 462 652.8 Q 445 651 445 636 L 445 624 Q 445 617 452 617 L 462 617 Q 476 617 476 603 L 476 510 Q 476 496 462 496 L 441 496
      Q 434 496 434 489 Z"/>
    <!-- the pixels streaming into the screen -->
    <rect id="px1" x="133" y="345" width="88" height="91" rx="10" fill="#FF6BBD"/>
    <rect id="px2" x="120" y="510" width="95" height="96" rx="10" fill="#FF6BBD"/>
    <rect id="px3" x="270" y="396" width="100" height="99" rx="11" fill="#FF6BBD"/>
    <rect id="px4" x="274" y="620" width="96" height="97" rx="10" fill="#FF6BBD"/>
    <rect id="px5" x="371" y="514" width="84" height="90" rx="9" fill="#FEC12C"/>
  </g>
</svg>
